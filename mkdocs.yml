site_name: Turnkey
site_description: Bring Your Own Detector
site_url: https://lijrjyan.github.io/turnkey/
repo_url: https://github.com/lijrjyan/turnkey
repo_name: lijrjyan/turnkey
copyright: Copyright &copy; 2026 Turnkey contributors

theme:
  name: material
  language: en
  logo: assets/turnkey-mark.svg
  favicon: assets/turnkey-mark.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started:
      - Installation: get-started/installation.md
      - Ten-minute quickstart: get-started/quickstart.md
  - Build:
      - Build a detector: guides/build-a-detector.md
      - Policies and typed signals: concepts/runtime.md
  - Debug:
      - Debug a run: guides/debug-a-run.md
      - Artifact model: concepts/artifacts.md
  - Notebooks:
      - Quickstart: notebooks/00_quickstart.ipynb
      - Build your own detector: notebooks/01_build_your_own_detector.ipynb
      - Debug a missed case: notebooks/02_debug_a_missed_case.ipynb
      - Typed signals: notebooks/03_typed_signals.ipynb
  - Reference:
      - CLI: reference/cli.md
      - Included methods: reference/methods.md
      - Detector authoring: reference/detector-authoring.md
