[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turnkey"
version = "0.1.0"
description = "Bring Your Own Detector: a development and debugging harness for jailbreak detection"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
hf = [
  "torch",
  "transformers",
  "datasets",
  "Pillow",
  "peft>=0.19.1",
]
judges = [
  "openai>=1.0",
]
docs = [
  "ipykernel>=6.29",
  "mkdocs-jupyter>=0.25",
  "mkdocs-material>=9.6",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.urls]
Documentation = "https://lijrjyan.github.io/turnkey/"
Issues = "https://github.com/lijrjyan/turnkey/issues"
Repository = "https://github.com/lijrjyan/turnkey"

[project.scripts]
turnkey = "turnkey.cli:main"
turnkey-refs = "turnkey.refs:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references", "outputs", "runs", ".git", ".venv", ".rd_queue"]
markers = [
  "slow: slow integration tests (opt-in / may download large models)",
  "gpu: requires CUDA-capable GPU",
]
