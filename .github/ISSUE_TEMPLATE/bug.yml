name: Bug report
description: Report reproducible incorrect Turnkey behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, internal datasets, personal data, or unredacted run bundles.
  - type: input
    id: version
    attributes:
      label: Turnkey version or commit
      placeholder: 0.1.0 source preview at <commit>
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Execution path
      options:
        - CPU or fake backend
        - Local GPU or local model
        - Live remote integration
        - Documentation or packaging only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized configuration and exact commands.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: environment_details
    attributes:
      label: Environment details
      description: Operating system, Python version, relevant optional extras, and sanitized error output.
