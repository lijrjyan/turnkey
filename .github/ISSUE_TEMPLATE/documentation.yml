name: Documentation problem
description: Report incorrect, unclear, inaccessible, or missing product documentation.
title: "docs: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Runtime truth belongs here; website navigation and presentation belong in turnkey-site.
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/get-started/quickstart.md
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Product version or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or expected experience
