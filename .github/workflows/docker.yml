name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Build images
        run: |
          docker build --target core -t "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" .
          docker tag "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" "ghcr.io/${{ github.repository }}:latest"
      - name: Smoke-test image
        run: docker run --rm "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
      - name: Push images
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker push "ghcr.io/${{ github.repository }}:latest"
          fi
