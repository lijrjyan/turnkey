run:
  name: smoke_wildguard
  out_dir: outputs
  redact: true
  max_samples: 4

dataset:
  name: fixtures_smoke
  params:
    n_samples: 4

model:
  backend: dummy
  model_id: dummy-smoke
  max_new_tokens: 32
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: keyword
  params:
    keywords: ["UNSAFE_PLACEHOLDER"]

judge:
  name: wildguard
  params:
    use_vllm: false  # Use HF backend for compatibility
    batch_size: 4
    device: "cuda"
