run:
  name: qwen3-0-6b-openai-compat-smoke
  out_dir: outputs
  redact: true
  max_samples: 4

dataset:
  name: fixtures_smoke
  params:
    n_samples: 4

model:
  backend: openai_compat
  base_url: http://127.0.0.1:8000
  api_key_env: OPENAI_API_KEY
  timeout_s: 300
  model_id: Qwen/Qwen3-0.6B
  max_new_tokens: 32
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: keyword
  params:
    keywords: ["UNSAFE_PLACEHOLDER"]

judge:
  name: dummy_refusal
  params: {}
