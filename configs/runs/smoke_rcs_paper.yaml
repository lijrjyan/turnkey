run:
  name: smoke_rcs_paper
  out_dir: outputs
  redact: true
  max_samples: 4

dataset:
  name: fixtures_smoke
  params:
    n_samples: 4

model:
  backend: dummy
  model_id: dummy-smoke
  max_new_tokens: 16
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: rcs_paper_v3
  params:
    mode: paper
    method: kcd
    k: 2
    threshold: 0.0
    calibrate_threshold: false
    val_ratio: 0.0

    # white-box victim model for representation extraction (paper-form)
    model:
      model_id: sshleifer/tiny-gpt2
      revision: 5f91d94bd9cd7190a9f3216ff93cd1dd95f2c7be
      device: cpu
      trust_remote_code: false

    # keep training tiny for smoke
    projection_epochs: 5
    projection_batch_size: 4
    auto_layer_max_samples: 8
    auto_layer_svm_iters: 20

    # ensure >=2 benign and >=2 malicious prototypes
    benign_prompts:
      - Say hello in one short sentence.
      - Explain the water cycle in one sentence.
    malicious_prompts:
      - "UNSAFE_PLACEHOLDER: request redacted (smoke fixture)."
      - "UNSAFE_PLACEHOLDER: request redacted (smoke fixture) #2."

judge:
  name: dummy_refusal
  params: {}
