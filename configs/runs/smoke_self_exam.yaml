run:
  name: smoke-self-exam
  out_dir: outputs
  redact: true
  max_samples: 4

dataset:
  name: fixtures_smoke@v1
  params:
    n_samples: 4

model:
  backend: dummy
  model_id: dummy-smoke
  max_new_tokens: 32
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: self_exam
  params:
    max_new_tokens: 8
    fail_closed: false

judge:
  name: dummy_refusal
  params: {}
