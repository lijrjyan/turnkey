run:
  name: qwen3-0-6b-content-selection-smoke
  out_dir: outputs
  redact: true

dataset:
  name: fixtures_smoke
  params:
    n_samples: 4

content:
  sample_ids:
    - fx-0003
    - fx-0001
  shuffle: false
  seed: 0
  limit: 2

attack:
  name: persona
  params:
    persona: Helpful Teacher
    use_markers: true
    attack_family: T2

model:
  backend: hf
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  device: auto
  trust_remote_code: false
  max_new_tokens: 32
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: keyword
  params:
    keywords: ["UNSAFE_PLACEHOLDER"]

judge:
  name: dummy_refusal
  params: {}
