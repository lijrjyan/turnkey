run:
  name: smoke_gradsafe
  out_dir: outputs
  redact: true
  max_samples: 3

dataset:
  name: fixtures_smoke
  params:
    n_samples: 3

model:
  backend: dummy
  model_id: dummy-smoke
  max_new_tokens: 32
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: gradsafe_v3
  params:
    model_id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    device: auto
    torch_dtype: auto
    local_files_only: true
    max_length: 128
    threshold: 0.0
    parameter_regex: "(lm_head|embed_tokens|wte)"

judge:
  name: dummy_refusal
  params: {}
