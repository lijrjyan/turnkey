run:
  name: v9-qwen3-0-6b-jailguard-reference-text-smoke
  out_dir: outputs
  redact: true
  max_samples: 2

dataset:
  name: fixtures_smoke
  params:
    n_samples: 4

content:
  sample_ids:
    - fx-0001
    - fx-0003
  shuffle: false
  seed: 0
  limit: 2

attack:
  name: persona
  params:
    persona: Helpful Teacher
    use_markers: true
    attack_family: T2

model:
  backend: hf
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  device: cpu
  trust_remote_code: false
  max_new_tokens: 8
  temperature: 0.0

nsg:
  enabled: true
  baseline_detector:
    name: allow_all
    params: {}

detector:
  name: jailguard_v3
  params:
    response_mode: backend
    n_variants: 2
    mutator: TI
    char_rate: 0.005
    threshold: 0.02
    similarity: bow
    max_new_tokens: 8
    seed: 0

judge:
  name: dummy_refusal
  params: {}
